<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>나의 에고 아바타 · 16 CHARACTERS · 3 BOOKS</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      background: #f5f1ff;
      color: #25202e
    }

    .wrap {
      max-width: 620px;
      margin: auto;
      min-height: 100vh;
      padding: 24px 18px 50px
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px #6d4fc21c
    }

    .top {
      text-align: center;
      margin: 25px 0
    }

    .tag {
      display: inline-block;
      background: #eee6ff;
      color: #6745b8;
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px
    }

    h1 {
      font-size: 32px;
      margin: 14px 0 8px
    }

    .sub {
      color: #777;
      line-height: 1.6;
      text-align: center;
    }

    .start {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      font-size: 17px;
      font-weight: 900;
      background: #6d4fc2;
      color: white;
      cursor: pointer
    }

    .progress {
      height: 8px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 28px
    }

    .bar {
      height: 100%;
      background: #6d4fc2;
      transition: .25s
    }

    .num {
      color: #7959c7;
      font-weight: 900;
      font-size: 14px
    }

    .q {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.4;
      margin: 10px 0 24px
    }

    .choice {
      width: 100%;
      text-align: left;
      border: 2px solid #eee;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin: 8px 0;
      font-size: 16px;
      line-height: 1.55;
      cursor: pointer
    }

    .choice:hover {
      border-color: #9a80dc;
      background: #faf8ff
    }

    .result {
      text-align: center
    }

    .avatar {
      margin: 14px auto 18px;
      width: min(100%, 360px);
      aspect-ratio: 299.5/260.75;
      border-radius: 22px;
      overflow: hidden;
      background: #faf7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px #6d4fc214
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block
    }

    .name {
      font-size: 30px;
      font-weight: 1000
    }

    .catch {
      color: #6d4fc2;
      font-weight: 800;
      margin: 8px 0 24px
    }

    .item {
      background: #f7f3ff;
      padding: 15px;
      border-radius: 16px;
      margin: 15px 0;
      font-weight: 800
    }

    .stats {
      text-align: left;
      margin-top: 28px;
      padding: 22px 4px 6px
    }

    .stat {
      margin: 20px 0
    }

    .label {
      display: flex;
      justify-content: space-between;
      font-weight: 800
    }

    .track {
      height: 13px;
      background: #eee;
      border-radius: 99px;
      margin-top: 9px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #7452cf, #9b7be3);
      border-radius: 99px
    }

    .desc {
      text-align: left;
      background: #fafafa;
      border-radius: 18px;
      padding: 18px;
      line-height: 1.75;
      margin-top: 22px
    }

    .retry {
      margin-top: 20px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 15px;
      font-weight: 900;
      background: #25202e;
      color: #fff
    }

    .note {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 18px
    }

    .bookrec {
      margin-top: 22px;
      text-align: left;
      background: #f7f3ff;
      border-radius: 20px;
      padding: 20px
    }

    .bookrec h3 {
      margin: 0 0 8px;
      font-size: 20px
    }

    .booktitle {
      font-size: 18px;
      font-weight: 900;
      color: #5e3fb3
    }

    .bookauthor {
      font-size: 14px;
      color: #777;
      margin: 4px 0 12px
    }

    .bookwhy {
      line-height: 1.7;
      color: #40394b
    }

    .bookbadge {
      display: inline-block;
      font-size: 12px;
      font-weight: 900;
      color: #6d4fc2;
      background: #fff;
      border-radius: 999px;
      padding: 6px 9px;
      margin-bottom: 10px
    }

    /* 1. 기본 input 스타일링 */
    input[type="text"],
    input[type="password"] {
      width: 100%;                  /* 너비 꽉 차게 */
      padding: 12px 16px;           /* 여백 */
      font-size: 15px;              /* 글자 크기 */
      color: #333333;               /* 텍스트 색상 */
      background-color: #f8f9fa;    /* 배경색 */
      border: 1px solid #e0e0e0;    /* 테두리 */
      border-radius: 8px;           /* 둥근 테두리 */
      outline: none;                /* 기본 아웃라인 제거 */
      box-sizing: border-box;       /* 패딩 포함 크기 계산 */
      transition: all 0.2s ease;    /* 애니메이션 효과 */
    }

    /* 2. 포커스(클릭/입력 중) 상태 스타일 */
    input[type="text"]:focus,
    input[type="password"]:focus {
      background-color: #ffffff;
      border-color: #4a90e2;        /* 포인트 컬러 (포커스 시 테두리 색) */
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15); /*은은한 후광 효과 */
    }

    /* 3. Placeholder(힌트 문구) 스타일 */
    input::placeholder {
      color: #aaa;
      font-size: 14px;
    }

    /* 4. 에러 상태 (필요 시 class="error" 부여) */
    input.error {
      border-color: #ff4d4f;
      background-color: #fff2f0;
    }
  </style>
</head>

          case 1: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 2: add('expression', L ? 1 : -1); add('independence', L ? 1 : -1); break;
          case 3: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 4: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 5: add('planning', L ? 1 : -1); add('flexibility', L ? -1 : 1); break;
          case 6: add('expression', L ? 1 : -1); add('empathy', L ? 1 : 0); add('defense', L ? -1 : 1); break;
          case 7: add('defense', L ? -1 : 1); add('expression', L ? 1 : -1); break;
          case 8: add('planning', L ? 1 : -1); add('flexibility', L ? -1 : 1); break;
          case 9: add('planning', L ? 1 : -1); add('flexibility', L ? -1 : 1); break;
          case 10: add('empathy', L ? 1 : -1); break;
          case 11: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 12: add('independence', L ? 1 : -1); add('empathy', L ? -1 : 1); break;
          case 13: add('planning', L ? 1 : 0); add('empathy', L ? -1 : 1); break;
          case 14: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 15: add('flexibility', L ? 1 : -1); add('planning', L ? -1 : 1); break;
          case 16: add('expression', L ? 1 : -1); add('defense', L ? -1 : 1); break;
          case 17: add('independence', L ? 1 : -1); add('empathy', L ? -1 : 1); break;
        }
      });
      // 관측된 raw 범위를 1~10으로 부드럽게 변환. 극단 답변도 1/10에 도달 가능.
      const max = { expression: 9, defense: 8, independence: 3, planning: 5, empathy: 5, flexibility: 4 };
      const level = k => Math.max(1, Math.min(10, Math.round(5.5 + 4.5 * raw[k] / max[k])));
      return { expression: level('expression'), defense: level('defense'), independence: level('independence'), planning: level('planning'), empathy: level('empathy'), flexibility: level('flexibility') };
    }
    function statRow(label, val) { return `<div class="stat"><div class="label"><span>${label}</span><span>LV.${val}</span></div><div class="track"><div class="fill" style="width:${val * 10}%"></div></div></div>` }
    function finish() {
      let bits = [majority([0, 1, 2, 3, 4, 6, 14, 16]), majority([0, 11]), majority([12, 17]), majority([5, 8, 9, 15])];
      let key = bits.join(''), r = resultData[key];
      let expression = bits[0] ? "겉으로 드러내는 힘" : "속에 간직하는 힘", energy = bits[1] ? "함께할 때 살아나는 에너지" : "혼자 있을 때 채워지는 에너지", direction = bits[2] ? "내 기준을 지키는 힘" : "관계를 살피는 힘", structure = bits[3] ? "미리 정리하는 힘" : "흐름에 맞추는 힘";
      app.innerHTML = `<div class="card result"><span class="tag">MY EGO AVATAR · 1 / 16</span><div class="avatar"><img src="${avatarImageMap[key]}" alt="${r.name} 캐릭터"></div><div class="name">${r.name}</div><div class="catch">${r.catch}</div><div class="item">대표 아이템 · ${r.item}</div><div class="stats">${(() => { const t = calcTraits(); return statRow('표현력', t.expression) + statRow('방어력', t.defense) + statRow('독립성', t.independence) + statRow('계획성', t.planning) + statRow('공감성', t.empathy) + statRow('유연성', t.flexibility) })()}</div><div class="desc"><b>${r.name}의 특성</b><br><br>${r.tags.map(x => '• ' + x).join('<br>')}<br><br><b>당신을 이루는 네 방향</b><br>${expression} · ${energy}<br>${direction} · ${structure}</div><div class="bookrec"><span class="bookbadge">📚 당신의 아바타가 고른 3권</span><h3>이 캐릭터에게 추천하는 책 3권</h3>${bookData[key].map((b, n) => `<div style="background:#fff;border-radius:16px;padding:15px;margin-top:12px"><div style="font-size:12px;font-weight:900;color:#8a6bd2">BOOK ${n + 1}</div><div class="booktitle">『${b.title}』</div><div class="bookauthor">${b.author}</div><div class="bookwhy">${b.why}</div></div>`).join('')}</div><button class="retry" onclick="showApplication()">현장조사 신청하기</button></div>`
    }

    // 이전 아바타 화면으로 복구하는 함수
    function restoreOriginalScreen() {
      if (originalBodyContent) {
        document.body.innerHTML = originalBodyContent; // 백업해둔 기존 화면으로 복원
        window.scrollTo(0, 0);
      }
    }

    function handleSubmissionComplete(event) {
      // 신청서 제출 완료 신호가 들어오면 기존 화면으로 되돌림
      if (event.data && event.data.type === 'app_submitted') {
        alert('신청이 완료되었습니다! 이전 화면으로 돌아갑니다.');
        restoreOriginalScreen();
        window.removeEventListener('message', handleSubmissionComplete);
      }
    }

    window.handleLogout = function () {
        // 1. 유저 권한 및 진행 단계 세션만 삭제 (신청자 DB 데이터는 유지!)
        localStorage.removeItem('userRole');
        localStorage.removeItem('currentStep');
        // 2. 초기 로그인 화면으로 안전하게 재호출
        home();
      }
  </script>
  <script>
    window.addEventListener('message', function (e) { 
      if (e.data && e.data.type === 'ubermenschApplication' && e.data.item) { 
        try { 
          const k = 'ubermenschApplications'; const a = JSON.parse(localStorage.getItem(k) || '[]'); a.push(e.data.item); localStorage.setItem(k, JSON.stringify(a)); 
        } catch (err) { 

        } 
      } 
    });
  </script>
  <script>
    // 1. 안전하게 #app 요소를 가져오는 헬퍼 함수
    function getApp() {
      return document.querySelector('#app') || document.getElementById('app');
    }
    function adminData() { 
      try { 
        return JSON.parse(localStorage.getItem('ubermenschApplications') || '[]') 
      } catch (e) { 
        return [] 
      } 
    }
    function saveAdminData(a) { localStorage.setItem('ubermenschApplications', JSON.stringify(a)) }
    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) }
    function fmtDate(v) { if (!v) return '-'; try { return new Date(v).toLocaleString('ko-KR') } catch (e) { return v } }
    window.openAdmin = function () {
      if(typeof window.renderAdmin === 'function') {
        window.renderAdmin();
      } else {
        console.error("renderAdmin Function Is Not Found");
      }
    }
    window.renderAdmin = function (q = '', status = '전체') {
      const app = getApp();
      if(!app) {
        console.error("#app 요소를 찾을 수 없습니다.");
        return;
      }
      const all = typeof adminData === 'function' ? adminData() : []; 
      const filtered = all.filter(x => (!q || [x.name, x.phone, x.interest, x.job].join(' ').toLowerCase().includes(q.toLowerCase())) && (status === '전체' || x.status === status));
      const counts = { 
        all: all.length, 
        new: all.filter(x => x.status === '신규').length, 
        contact: all.filter(x => x.status === '연락완료').length, 
        fixed: all.filter(x => x.status === '일정확정').length, 
        done: all.filter(x => x.status === '참여완료').length 
      };
      app.innerHTML = `<div class="top"><span class="tag">ÜBERMENSCH ADMIN</span><h1>현장조사 관리자</h1><p class="sub">신청자 현황과 일정을 한 곳에서 관리해요.</p></div>
                      <div class="card"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
                      ${[['전체', counts.all], ['신규', counts.new], ['연락완료', counts.contact], ['일정확정', counts.fixed], ['참여완료', counts.done]].map(x => `<div style="background:#f6f1ff;border-radius:16px;padding:14px"><b>${x[0]}</b><div style="font-size:26px;font-weight:900;color:#7357b5">${x[1]}</div></div>`).join('')}</div>
                      <input id="adminSearch" value="${esc(q)}" placeholder="이름·연락처·관심분야 검색" style="width:100%;padding:13px;border:1px solid #ddd4ef;border-radius:12px;font:inherit;margin-bottom:9px">
                      <select id="adminStatus" style="width:100%;padding:13px;border:1px solid #ddd4ef;border-radius:12px;font:inherit;margin-bottom:12px"><option>전체</option>${['신규', '연락완료', '일정확정', '참여완료'].map(v => `<option ${status === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
                      <button class="start" onclick="renderAdmin(document.getElementById('adminSearch').value,document.getElementById('adminStatus').value)">검색 / 필터 적용</button></div>
                      <div class="card"><h2 style="margin-top:0">신청자 목록</h2>${filtered.length ? filtered.slice().reverse().map(x => `<button class="choice" onclick="adminDetail('${esc(x.id)}')"><b>${esc(x.name || '이름 없음')}</b><br><span style="font-size:13px;color:#777">${esc(x.phone)} · ${esc(x.status || '신규')} · ${fmtDate(x.submittedAt)}</span></button>`).join('') : '<p class="sub">저장된 신청자가 없습니다.</p>'}</div>
                      <button class="choice" style="text-align:center" onclick="handleLogout()">← 테스트 홈으로</button>`;
      window.scrollTo(0, 0);
    }
    function adminDetail(id) {
      const a = adminData(), x = a.find(v => v.id === id); if (!x) return renderAdmin();
      app.innerHTML = `<div class="top"><span class="tag">APPLICATION DETAIL</span><h1>${esc(x.name)}</h1><p class="sub">${esc(x.phone)} · ${fmtDate(x.submittedAt)}</p></div><div class="card">
 ${[['연령대', x.age], ['직업 / 소속', x.job], ['독서 빈도', x.frequency], ['관심 분야', x.interest], ['책 선택 기준', x.criteria], ['가능 일정', x.schedule], ['개인정보 동의', x.privacyConsent], ['데이터 활용 동의', x.dataConsent], ['참여 동의', x.participationConsent]].map(r => `<div style="padding:11px 0;border-bottom:1px solid #eee"><b>${r[0]}</b><div style="margin-top:5px;white-space:pre-wrap;color:#555">${esc(r[1] || '-')}</div></div>`).join('')}
 <label style="display:block;font-weight:800;margin:16px 0 7px">진행 상태</label><select id="detailStatus" style="width:100%;padding:13px;border:1px solid #ddd4ef;border-radius:12px;font:inherit">${['신규', '연락완료', '일정확정', '참여완료'].map(v => `<option ${x.status === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
 <label style="display:block;font-weight:800;margin:16px 0 7px">관리자 메모</label><textarea id="detailMemo" style="width:100%;min-height:110px;padding:13px;border:1px solid #ddd4ef;border-radius:12px;font:inherit">${esc(x.adminMemo || '')}</textarea>
 <button class="start" onclick="saveApplicant('${esc(id)}')">변경사항 저장</button><button class="choice" style="text-align:center;margin-top:10px" onclick="deleteApplicant('${esc(id)}')">신청자 삭제</button></div><button class="choice" style="text-align:center" onclick="renderAdmin()">← 목록으로</button>`; window.scrollTo(0, 0)
    }
    function saveApplicant(id) { const a = adminData(), i = a.findIndex(v => v.id === id); if (i < 0) return; a[i].status = document.getElementById('detailStatus').value; a[i].adminMemo = document.getElementById('detailMemo').value; saveAdminData(a); alert('저장되었습니다.'); adminDetail(id) }
    function deleteApplicant(id) { if (!confirm('이 신청자를 삭제할까요?')) return; saveAdminData(adminData().filter(v => v.id !== id)); renderAdmin() }
  </script>
  <script>
    (function () {
      // 메인 시작 화면이 렌더링될 때까지 감시 후 슬라이더 주입_20260918_KKDADD 
      const injectCharacterSlider = () => {
        const cardElem = document.querySelector('.card-0');
        if (!cardElem || document.getElementById('ego-avatar-slider-wrap')) return;

        // 슬라이더 전용 CSS 주입
        const style = document.createElement('style');
        style.textContent = `
        #ego-avatar-slider-wrap {
          width: 100%;
          max-width: 320px;
          margin: 20px auto 10px;
          overflow: hidden;
          border-radius: 20px;
          background: #faf7ff;
          box-shadow: 0 8px 24px rgba(109, 79, 194, 0.12);
          position: relative;
        }
        .ego-slider-track {
          display: flex;
          transition: transform 0.4s ease-in-out;
          width: 100%;
        }
        .ego-slide-item {
          min-width: 100%;
          aspect-ratio: 299.5 / 260.75;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .ego-slide-item img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }
        .ego-slider-dots {
          display: flex;
          justify-content: center;
          gap: 6px;
          padding: 10px 0;
          background: #faf7ff;
        }
        .ego-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #d8cbf5;
          transition: all 0.3s;
        }
        .ego-dot.active {
          width: 18px;
          border-radius: 10px;
          background: #6d4fc2;
        }
      `;
        document.head.appendChild(style);

        // 슬라이더 HTML 요소 생성
        const sliderWrap = document.createElement('div');
        sliderWrap.id = 'ego-avatar-slider-wrap';

        const track = document.createElement('div');
        track.className = 'ego-slider-track';

        const dotsWrap = document.createElement('div');
        dotsWrap.className = 'ego-slider-dots';

        // avatarImages 배열(16개)을 이용해 슬라이드 구성
        if (typeof avatarImages !== 'undefined' && Array.isArray(avatarImages)) {
          avatarImages.forEach((imgSrc, idx) => {
            const slide = document.createElement('div');
            slide.className = 'ego-slide-item';
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = `Ego Avatar ${idx + 1}`;
            slide.appendChild(img);
            track.appendChild(slide);

            const dot = document.createElement('div');
            dot.className = `ego-dot ${idx === 0 ? 'active' : ''}`;
            dotsWrap.appendChild(dot);
          });
        }

        sliderWrap.appendChild(track);
        sliderWrap.appendChild(dotsWrap);

        // .top 클래스 요소 하단(제목/설명글 아래, 시작 버튼 위)에 주입
        cardElem.prepend(sliderWrap);

        // 슬라이더 인터랙션 동작 스크립트
        let currentIndex = 0;
        const totalSlides = avatarImages ? avatarImages.length : 0;
        const dots = dotsWrap.querySelectorAll('.ego-dot');

        const goToSlide = (index) => {
          currentIndex = index;
          track.style.transform = `translateX(-${currentIndex * 100}%)`;
          dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIndex);
          });
        };

        // 2.5초마다 자동 슬라이드
        let autoSlideTimer = setInterval(() => {
          const nextIndex = (currentIndex + 1) % totalSlides;
          goToSlide(nextIndex);
        }, 2500);

        // 터치/드래그 스와이프 지원
        let startX = 0;
        let isDragging = false;

        sliderWrap.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          isDragging = true;
          clearInterval(autoSlideTimer);
        }, { passive: true });

        sliderWrap.addEventListener('touchend', (e) => {
          if (!isDragging) return;
          const endX = e.changedTouches[0].clientX;
          const diffX = startX - endX;

          if (Math.abs(diffX) > 30) {
            if (diffX > 0) {
              goToSlide((currentIndex + 1) % totalSlides);
            } else {
              goToSlide((currentIndex - 1 + totalSlides) % totalSlides);
            }
          }

          isDragging = false;
          autoSlideTimer = setInterval(() => {
            goToSlide((currentIndex + 1) % totalSlides);
          }, 2500);
        }, { passive: true });
      };

      // DOM 변경 감지하여 첫 시작 화면일 때 슬라이더 자동 주입
      const observer = new MutationObserver(() => {
        if (document.querySelector('.card') && !document.getElementById('ego-avatar-slider-wrap')) {
          injectCharacterSlider();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      // 초기 로드 시 실행
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(injectCharacterSlider, 100);
      } else {
        document.addEventListener('DOMContentLoaded', injectCharacterSlider);
      }
    })();
  </script>
